<form [formGroup]="leadForm" (ngSubmit)="onSubmit()" class="space-y-4 max-w-md">
<div>
  <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
    Nome do Lead
  </label>
  <input
    id="name"
    type="text"
    formControlName="name"
    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
  />
  @if (name.invalid && name.touched){
    <p class="text-sm text-red-600 mt-1">Nome muito curto</p>
  }
</div>
<div>
  <label for="company" class="block text-sm font-medium text-gray-700 mb-1">
    Empresa
  </label>
  <input
    id="company"
    type="text"
    formControlName="company"
    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
  />
  @if (company.invalid && company.touched){
    <p class="text-sm text-red-600 mt-1">Empresa muito curta</p>
  }
</div>
<div>
  <label for="status" class="block text-sm font-medium text-gray-700 mb-1">
    Status
  </label>
  <select
    id="status"
    formControlName="status"
    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
  >
  @for (option of statusOptions; track option.value){
    <option [value]="option.value">{{option.label}}</option>
  }
  </select>
</div>

<div>
  <label for="estimatedValue" class="block text-sm font-medium text-gray-700 mb-1">
    Valor estimado (R$)
  </label>
  <input
    id="estimatedValue"
    type="number"
    step="0.01"
    formControlName="estimatedValue"
    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
  />
  @if (estimatedValeu.invalid && estimatedValeu.touched){
    <p class="text-sm text-red-600 mt-1"> Valor não pode ser negativo</p>
  }
</div>
<button
type="submit"
[disabled]="isSubmitting"
class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-7-- disabled:opacity-50 transition">
{{isSubmitting ? "Salvando..." : submitLabel}}
</button>

</form>
